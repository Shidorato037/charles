<div class="container">
<main>

<h2>Contato</h2>

<p>
Entre em contato conosco para dúvidas ou sugestões. A mensagem será enviada direto para o WhatsApp.
</p>

<form id="contactForm">
<div class="w3-row w3-section">
  <div class="w3-col" style="width:50px"><i class="w3-xxlarge fa fa-user"></i></div>
    <div class="w3-rest">
      <input id="firstName" class="w3-input w3-border" name="firstName" type="text" placeholder="Primeiro Nome" required>
    </div>
</div>

<div class="w3-row w3-section">
  <div class="w3-col" style="width:50px"><i class="w3-xxlarge fa fa-user"></i></div>
    <div class="w3-rest">
      <input id="lastName" class="w3-input w3-border" name="lastName" type="text" placeholder="Segundo Nome" required>
    </div>
</div>

<div class="w3-row w3-section">
  <div class="w3-col" style="width:50px"><i class="w3-xxlarge fa fa-envelope-o"></i></div>
    <div class="w3-rest">
      <input id="email" class="w3-input w3-border" name="email" type="email" placeholder="E-mail" required>
    </div>
</div>

<div class="w3-row w3-section">
  <div class="w3-col" style="width:50px"><i class="w3-xxlarge fa fa-phone"></i></div>
    <div class="w3-rest">
      <input id="phone" class="w3-input w3-border" name="phone" type="tel" placeholder="Telefone" required>
    </div>
</div>

<div class="w3-row w3-section">
  <div class="w3-col" style="width:50px"><i class="w3-xxlarge fa fa-pencil"></i></div>
    <div class="w3-rest">
      <input id="message" class="w3-input w3-border" name="message" type="text" placeholder="Mensagem" required>
    </div>
</div>

<button type="submit" class="w3-button w3-block w3-section w3-blue w3-ripple w3-padding">Enviar</button>
</form>
</main>
</div>
<script src="./JS/script.js"></script>

</footer>
</body>
</html>
